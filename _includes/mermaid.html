<script type="module">
    (async function () {
        const fencedMermaidBlocks = document.querySelectorAll(
            "pre code.language-mermaid, pre code.lang-mermaid"
        );

        fencedMermaidBlocks.forEach(function (codeBlock) {
            const pre = codeBlock.closest("pre");

            if (!pre) {
                return;
            }

            const container = document.createElement("pre");
            // Preserve any extra class added via a kramdown IAL (e.g.
            // `{: .mermaid-lr}` after the fence), so per-diagram styling
            // hooks survive this element being rebuilt from scratch.
            container.className = ("mermaid " + pre.className).trim();
            container.textContent = codeBlock.textContent || "";

            pre.replaceWith(container);
        });

        if (!document.querySelector(".mermaid")) {
            return;
        }

        try {
            const { default: mermaid } = await import(
                "https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs"
            );

            mermaid.initialize({
                startOnLoad: false,
            });

            await mermaid.run({
                querySelector: ".mermaid",
            });
        } catch (error) {
            console.error("Mermaid failed to load", error);
        }
    })();
</script>
